<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📚 近くの図書館を探す</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
      background: #f5f5f5;
      color: #333;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── ヘッダー ── */
    header {
      background: #2c5f8a;
      color: #fff;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,.25);
      z-index: 1000;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      white-space: nowrap;
    }

    /* ── 検索行 ── */
    .search-row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    #locationInput {
      flex: 1;
      min-width: 160px;
      padding: 7px 12px;
      border: none;
      border-radius: 6px;
      font-size: 0.88rem;
      outline: none;
      background: #fff;
      color: #333;
    }
    #locationInput::placeholder { color: #aaa; }

    .btn {
      padding: 7px 14px;
      border: none;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s, opacity .2s;
    }
    .btn:disabled { opacity: .5; cursor: default; }

    #locationBtn { background: #f0a500; color: #fff; }
    #locationBtn:hover:not(:disabled) { background: #d49000; }

    #gpsBtn {
      background: rgba(255,255,255,.2);
      color: #fff;
      border: 1px solid rgba(255,255,255,.4);
    }
    #gpsBtn:hover:not(:disabled) { background: rgba(255,255,255,.3); }

    #status {
      font-size: 0.78rem;
      color: rgba(255,255,255,.8);
      white-space: nowrap;
    }

    /* ── メインレイアウト ── */
    main { display: flex; flex: 1; overflow: hidden; }
    #map { flex: 3; min-width: 0; }

    /* ── サイドバー ── */
    #sidebar {
      width: 340px;
      min-width: 260px;
      background: #fff;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #ddd;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 10px 16px;
      background: #f0f4f8;
      border-bottom: 1px solid #ddd;
      font-size: 0.82rem;
      color: #555;
      font-weight: 600;
    }

    #library-list { flex: 1; overflow-y: auto; }

    .empty-msg {
      padding: 40px 20px;
      text-align: center;
      color: #999;
      font-size: 0.9rem;
      line-height: 1.8;
    }

    .lib-item {
      padding: 11px 14px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: background .15s;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .lib-item:hover  { background: #eef4fb; }
    .lib-item.active { background: #ddeeff; }

    .lib-num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #2c5f8a;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .lib-info { flex: 1; min-width: 0; }

    .lib-name {
      font-weight: 700;
      font-size: 0.9rem;
      line-height: 1.3;
      margin-bottom: 2px;
    }

    .lib-address {
      font-size: 0.76rem;
      color: #666;
      line-height: 1.4;
    }

    .lib-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .lib-dist { font-size: 0.76rem; color: #2c5f8a; font-weight: 600; }

    .lib-link {
      font-size: 0.73rem;
      color: #2c5f8a;
      text-decoration: none;
    }
    .lib-link:hover { text-decoration: underline; }

    /* ── Leaflet ── */
    .leaflet-popup-content { font-size: 0.85rem; line-height: 1.6; }
    .popup-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
    .popup-link { color: #2c5f8a; font-size: 0.8rem; }

    #library-list::-webkit-scrollbar { width: 6px; }
    #library-list::-webkit-scrollbar-track { background: #f0f0f0; }
    #library-list::-webkit-scrollbar-thumb { background: #bbb; border-radius: 3px; }

    @media (max-width: 640px) {
      main { flex-direction: column; }
      #map { flex: 1; min-height: 45dvh; }
      #sidebar { width: 100%; border-left: none; border-top: 1px solid #ddd; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>📚 近くの図書館を探す</h1>
  </div>
  <div class="search-row">
    <input type="text" id="locationInput"
      placeholder="地名・住所で検索（例: 渋谷区、札幌市北区）" autocomplete="off" />
    <button class="btn" id="locationBtn">🔍 検索</button>
    <button class="btn" id="gpsBtn">📍 現在地</button>
    <span id="status"></span>
  </div>
</header>

<main>
  <div id="map"></div>
  <div id="sidebar">
    <div id="sidebar-header">図書館一覧</div>
    <div id="library-list">
      <div class="empty-msg">
        地名を入力して「🔍 検索」か<br>「📍 現在地」で検索してください
      </div>
    </div>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  /* ─── 地図初期化 ─── */
  const map = L.map('map').setView([35.6895, 139.6917], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19,
  }).addTo(map);

  /* ─── 状態 ─── */
  let markers      = [];
  let activeIndex  = -1;
  let centerMarker = null;

  /* ─── 要素 ─── */
  const locationInput = document.getElementById('locationInput');
  const locationBtn   = document.getElementById('locationBtn');
  const gpsBtn        = document.getElementById('gpsBtn');
  const statusEl      = document.getElementById('status');
  const listEl        = document.getElementById('library-list');
  const headerEl      = document.getElementById('sidebar-header');

  /* ─── ユーティリティ ─── */
  function setStatus(msg) { statusEl.textContent = msg; }

  function setBusy(busy) {
    locationBtn.disabled = busy;
    gpsBtn.disabled      = busy;
  }

  function calcDistance(lat1, lng1, lat2, lng2) {
    const R    = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a    =
      Math.sin(dLat / 2) ** 2 +
      Math.cos(lat1 * Math.PI / 180) *
      Math.cos(lat2 * Math.PI / 180) *
      Math.sin(dLng / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function fmtDist(km) {
    return km < 1 ? `${Math.round(km * 1000)} m` : `${km.toFixed(1)} km`;
  }

  /* ─── マーカーアイコン ─── */
  function makeIcon(num, active) {
    const bg  = active ? '#f0a500' : '#2c5f8a';
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="30" height="40" viewBox="0 0 30 40">
      <path d="M15 0C6.7 0 0 6.7 0 15c0 10 15 25 15 25S30 25 30 15C30 6.7 23.3 0 15 0z" fill="${bg}"/>
      <circle cx="15" cy="15" r="9" fill="#fff"/>
      <text x="15" y="19.5" text-anchor="middle" font-size="10" font-weight="bold" fill="${bg}" font-family="sans-serif">${num}</text>
    </svg>`;
    return L.divIcon({ html: svg, iconSize: [30, 40], iconAnchor: [15, 40], popupAnchor: [0, -42], className: '' });
  }

  /* ─── Nominatim ジオコーディング ─── */
  async function geocode(query) {
    const url  = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1&accept-language=ja`;
    const res  = await fetch(url, { headers: { 'Accept-Language': 'ja' } });
    if (!res.ok) throw new Error('ジオコーディング失敗');
    const data = await res.json();
    if (!data.length) throw new Error(`「${query}」の場所が見つかりませんでした`);
    return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
  }

  /* ─── CALIL API（サーバーサイドProxy経由） ─── */
  // APIキーはサーバー（api/library.js）だけが知っている
  async function fetchLibraries(lat, lng) {
    const params = new URLSearchParams({ geocode: `${lng},${lat}`, limit: 20 });
    const res    = await fetch(`/api/library?${params}`);
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `サーバーエラー (${res.status})`);
    }
    const data = await res.json();
    return Array.isArray(data) ? data : [];
  }

  /* ─── クリア ─── */
  function clearAll() {
    markers.forEach(({ marker }) => map.removeLayer(marker));
    markers     = [];
    activeIndex = -1;
    listEl.innerHTML = '';
    if (centerMarker) { map.removeLayer(centerMarker); centerMarker = null; }
  }

  /* ─── アクティブ化 ─── */
  function activate(index) {
    if (activeIndex === index) return;
    if (activeIndex >= 0) {
      markers[activeIndex].marker.setIcon(makeIcon(activeIndex + 1, false));
      document.getElementById(`lib-${activeIndex}`)?.classList.remove('active');
    }
    activeIndex = index;
    markers[index].marker.setIcon(makeIcon(index + 1, true));
    markers[index].marker.openPopup();
    map.panTo(markers[index].latlng);
    const el = document.getElementById(`lib-${index}`);
    if (el) { el.classList.add('active'); el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  }

  /* ─── 図書館描画（共通） ─── */
  async function renderLibraries(centerLat, centerLng, centerLabel) {
    setStatus('図書館を検索中…');

    let libs;
    try {
      libs = await fetchLibraries(centerLat, centerLng);
    } catch (e) {
      alert(`エラー: ${e.message}`);
      setStatus(''); setBusy(false);
      return;
    }

    clearAll();

    centerMarker = L.circleMarker([centerLat, centerLng], {
      radius: 8, color: '#e44', fillColor: '#e44', fillOpacity: 0.9, weight: 2,
    }).addTo(map).bindPopup(`📍 ${centerLabel}`);

    if (!libs.length) {
      listEl.innerHTML = '<div class="empty-msg">周辺に図書館が見つかりませんでした。</div>';
      headerEl.textContent = '図書館一覧（0件）';
      setStatus('0件'); setBusy(false);
      return;
    }

    const withDist = libs
      .filter(lib => lib.geocode)
      .map(lib => {
        const [gLat, gLng] = lib.geocode.split(',').map(Number);
        return { ...lib, _lat: gLat, _lng: gLng, _dist: calcDistance(centerLat, centerLng, gLat, gLng) };
      })
      .sort((a, b) => a._dist - b._dist);

    const bounds = [[centerLat, centerLng]];

    withDist.forEach((lib, i) => {
      const latlng = L.latLng(lib._lat, lib._lng);
      bounds.push([lib._lat, lib._lng]);

      const popup = L.popup().setContent(`
        <div class="popup-name">📚 ${lib.formal || lib.systemname || '図書館'}</div>
        ${lib.address ? `<div>${lib.address}</div>` : ''}
        ${lib.tel     ? `<div>📞 ${lib.tel}</div>` : ''}
        ${lib.url_pc  ? `<a class="popup-link" href="${lib.url_pc}" target="_blank" rel="noopener">🌐 公式サイト</a>` : ''}
      `);

      const marker = L.marker(latlng, { icon: makeIcon(i + 1, false) })
        .addTo(map).bindPopup(popup).on('click', () => activate(i));

      markers.push({ marker, latlng });

      const item = document.createElement('div');
      item.className = 'lib-item';
      item.id = `lib-${i}`;
      item.innerHTML = `
        <div class="lib-num">${i + 1}</div>
        <div class="lib-info">
          <div class="lib-name">${lib.formal || lib.systemname || '図書館'}</div>
          ${lib.address ? `<div class="lib-address">${lib.address}</div>` : ''}
          <div class="lib-meta">
            <span class="lib-dist">📍 ${fmtDist(lib._dist)}</span>
            ${lib.tel    ? `<span style="font-size:.75rem;color:#666">📞 ${lib.tel}</span>` : ''}
            ${lib.url_pc ? `<a class="lib-link" href="${lib.url_pc}" target="_blank" rel="noopener">🌐 公式サイト</a>` : ''}
          </div>
        </div>
      `;
      item.addEventListener('click', () => activate(i));
      listEl.appendChild(item);
    });

    headerEl.textContent = `図書館一覧（${withDist.length}件）`;
    map.fitBounds(bounds, { padding: [40, 40] });
    setStatus(`${withDist.length}件見つかりました`);
    setBusy(false);
    if (withDist.length > 0) activate(0);
  }

  /* ─── 地名検索 ─── */
  async function doLocationSearch() {
    const query = locationInput.value.trim();
    if (!query) { alert('検索する地名・住所を入力してください。'); locationInput.focus(); return; }

    setBusy(true);
    setStatus('場所を検索中…');

    let geo;
    try {
      geo = await geocode(query);
    } catch (e) {
      alert(e.message);
      setStatus(''); setBusy(false);
      return;
    }

    await renderLibraries(geo.lat, geo.lng, query);
  }

  /* ─── 現在地検索 ─── */
  async function doGpsSearch() {
    setBusy(true);
    setStatus('現在地を取得中…');

    let lat, lng;
    try {
      const pos = await new Promise((res, rej) =>
        navigator.geolocation.getCurrentPosition(res, rej, { timeout: 10000 })
      );
      lat = pos.coords.latitude;
      lng = pos.coords.longitude;
    } catch (e) {
      alert('現在地の取得に失敗しました。\nブラウザの位置情報を許可してください。');
      setStatus(''); setBusy(false);
      return;
    }

    await renderLibraries(lat, lng, '現在地');
  }

  /* ─── イベント ─── */
  locationBtn.addEventListener('click', doLocationSearch);
  gpsBtn.addEventListener('click', doGpsSearch);
  locationInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLocationSearch(); });
</script>
</body>
</html>
